# 公网入口（host 网络，监听 80）。Oracle 安全组只放行 22/80，且宿主 MTU 9000
# 与 docker bridge 1500 不一致会让端口映射丢包，因此用 host 网络 + 固定 upstream。
upstream mio_backend {
    server 172.18.0.5:8081;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass http://mio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：关闭缓冲并放宽超时，否则事件会被缓存到流结束才下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}

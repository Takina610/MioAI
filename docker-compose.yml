# MioAI 一键部署：MySQL + PostgreSQL(pgvector 向量库) + Redis(缓存) + 后端 + 前端
#
# 使用方式：
#   1. 复制环境变量模板：cp .env.example .env 并填入真实密钥
#   2. docker compose up -d --build
#   3. 初始化数据库（首次）：docker compose exec -T mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" mio_ai < MioAIBackend/mio_ai.sql
#      （也可用 MYSQL_INITDB 脚本自动执行，见 mysql.volumes 注释）
#   4. 访问 http://localhost:8090

services:
  mysql:
    image: mysql:8.0
    container_name: mio-ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme-root}
      MYSQL_DATABASE: mio_ai
      MYSQL_USER: ${MYSQL_USERNAME:-mioai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（表结构 + 种子数据）
      - ./MioAIBackend/mio_ai.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-changeme-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 向量库：PostgreSQL + pgvector 扩展（镜像自带扩展，无需手动编译）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mio-ai-postgres
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mioai}
      POSTGRES_DB: ${PG_DATABASE:-mio_ai_vec}
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-postgres} -d ${PG_DATABASE:-mio_ai_vec}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 仅作缓存使用（登录态/验证码等）；向量检索已迁移到 PostgreSQL(pgvector)
  redis:
    image: redis:7-alpine
    container_name: mio-ai-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./MioAIBackend
      dockerfile: Dockerfile
    container_name: mio-ai-backend
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USERNAME: ${MYSQL_USERNAME:-mioai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USERNAME: ${PG_USERNAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-mioai}
      PG_DATABASE: ${PG_DATABASE:-mio_ai_vec}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Embedding 网关（OpenAI 兼容）。密钥填在 .env 的 EMBED_APIKEY；
      # 注意带连字符的 EMBED-APIKEY 无法在 compose 插值中使用，容器内走下划线别名
      EMBED_APIKEY: ${EMBED_APIKEY:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-https://api.42x.shop/v1}
      EMBED_MODEL: ${EMBED_MODEL:-mistral-embed}
      # 仅重排（rerank）还依赖 DashScope 原生端点，默认关闭，可留空
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-mio-ai}
      R2_CDN_DOMAIN: ${R2_CDN_DOMAIN}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai"
    restart: unless-stopped

  frontend:
    build:
      context: ./MioAIFrontend
      dockerfile: Dockerfile
    container_name: mio-ai-frontend
    depends_on:
      - backend
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  mysql-data:
  pg-data:
  redis-data:

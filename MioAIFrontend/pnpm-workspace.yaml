# pnpm 9 及更早版本要求 workspaces 根必须声明 packages，否则 install 直接报
# "packages field missing or empty" 中断构建。Cloudflare Pages 实际落到的 pnpm 版本
# 随构建镜像与锁文件变化（实测出现过 9.10.0），显式留空让 9 / 10 / 12 共用一份配置。
packages: []

allowBuilds:
  '@parcel/watcher': true
  '@vue-office/docx': true
  '@vue-office/pdf': true
  core-js: true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@vue-office/docx'
  - '@vue-office/pdf'
  - core-js
  - vue-demi
